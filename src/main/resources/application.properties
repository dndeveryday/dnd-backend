spring.application.name=dnd-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
app.keycloak.realm=${KEYCLOAK_REALM:dnd}
app.keycloak.provisioner-client-id=${KEYCLOAK_PROVISIONER_CLIENT_ID:}
app.keycloak.provisioner-client-secret=${KEYCLOAK_PROVISIONER_CLIENT_SECRET:}
